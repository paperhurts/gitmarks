name: Feature request
description: Suggest an improvement to gitmarks
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation where gitmarks falls short for you.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: markdown
    attributes:
      value: >
        Heads-up: gitmarks deliberately stays serverless and single-user —
        multi-user collections, thumbnails, sub-second sync, and client-side
        encryption are documented non-goals (see spec.md).
